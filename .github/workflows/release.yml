name: build-and-release

on:
  push:
    tags: ['v*']
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar
        shell: pwsh
        env:
          LIDLOCK_REPO: ${{ github.repository }}
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0' }
          $env:LIDLOCK_VERSION = $version
          cmd /c build.cmd
          if ($LASTEXITCODE -ne 0) { throw 'La compilación falló' }
          $hash = (Get-FileHash build\LidLock.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  LidLock.exe" | Out-File -Encoding ascii build\LidLock.exe.sha256
          Get-Content build\LidLock.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: LidLock
          path: |
            build/LidLock.exe
            build/LidLock.exe.sha256

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME build/LidLock.exe build/LidLock.exe.sha256 `
            --title "LidLock $env:GITHUB_REF_NAME" --generate-notes
